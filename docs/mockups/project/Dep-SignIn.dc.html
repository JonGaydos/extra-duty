</div>

<a href="#" style="font-size: 14px; font-weight: 600">Forgot password?</a>
<div style="display: flex; gap: 8px; align-items: flex-start; background: #FFF4E5; border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.45; color: #6B3A00">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>

</div>
</div>
</form>

<span class="muted" style="font-size: 12px; text-align: center; line-height: 1.5">After your password, we email you a 6-digit code to finish signing in.</span>
