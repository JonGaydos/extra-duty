# SonarCloud Automatic Analysis settings. Values here override the same settings in the SonarCloud UI.

# Application code, and test code analyzed as tests.
sonar.sources=src,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Generated by drizzle-kit: migration snapshots.
sonar.exclusions=src/db/migrations/meta/**

# Migrations are generated SQL that repeats by design.
sonar.cpd.exclusions=src/db/migrations/**
